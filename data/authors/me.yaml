role: PhD Researcher in Linguistics

bio: |
  Milad Shariatmadari is a linguist specializing in language variation and
  change from a usage-based perspective. His research combines quantitative
  linguistics, corpus studies, statistical modeling, and experimental
  approaches. His main research interests include word order variation,
  complex predicates, grammaticalization, and the languages of West Asia
  and the Caucasus.

